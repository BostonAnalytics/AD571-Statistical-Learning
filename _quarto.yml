project:
  type: book
  output-dir: _book

book:
  title: "Statistical Learning Lecture Notes"
  author: "Nakul R. Padalkar"
  date: today
  chapters:
    - index.qmd
    - part: "Lecture Notes"
      chapters:
        - lectures/01-statistical-learning-foundations.qmd
        - lectures/02-linear-regression.qmd
        - lectures/03-model-assessment-resampling.qmd
        - lectures/04-data-splitting-feature-engineering.qmd
        - lectures/05-model-selection-regularization.qmd
        - lectures/06-dimension-reduction.qmd
        - lectures/07-bias-variance-nonlinear.qmd
        - lectures/08-logistic-discriminant.qmd
        - lectures/09-margins-perceptron.qmd
        - lectures/10-tree-based-methods.qmd
        - lectures/11-ensemble-methods.qmd
        - lectures/12-support-vector-machines.qmd
        - lectures/13-unsupervised-learning.qmd
        - lectures/14-statistical-learning-in-practice.qmd
    - part: "Labs"
      chapters:
        - labs/03-resampling-methods.qmd

format:
  html:
    theme:
      - theme/theme.scss
    html-math-method:
      method: katex
    number-equations: true
    number-sections: true
    toc: true
    code-overflow: wrap
    grid:
      sidebar-width: 260px
      body-width: 900px
      margin-width: 200px
      gutter-width: 1.5rem

bibliography: references.bib
tbl-cap-location: top
crossref:
  fig-title: '**Figure**'
  fig-labels: '**arabic**'
  title-delim: "**:**"
  tbl-title: '**Table**'
  tbl-labels: '**arabic**'
editor:
  markdown:
    wrap: 65
